<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Yeezik Games</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --secondary: #6e6e73;
      --line: rgba(0, 0, 0, 0.08);
      --blue: #0071e3;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.04), 0 12px 32px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.06), 0 24px 48px rgba(0, 0, 0, 0.10);
      --sheet: rgba(255, 255, 255, 0.92);
      --field: #f5f5f7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --secondary: #a1a1a6;
        --line: rgba(255, 255, 255, 0.10);
        --blue: #2997ff;
        --shadow: none;
        --shadow-hover: 0 0 0 1px rgba(255, 255, 255, 0.12);
        --sheet: rgba(28, 28, 30, 0.92);
        --field: #2c2c2e;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 96px 20px 64px;
    }

    /* Intestazione */
    header { text-align: center; margin-bottom: 64px; }

    .eyebrow {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--secondary);
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(2.6rem, 7vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
    }

    .subtitle {
      margin-top: 14px;
      font-size: clamp(1.1rem, 2.4vw, 1.35rem);
      color: var(--secondary);
      font-weight: 400;
    }

    .share-btn {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border: none;
      border-radius: 980px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: .95rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .2s ease;
    }
    .share-btn:hover { opacity: .85; }
    .share-btn svg { width: 16px; height: 16px; }

    /* Griglia giochi */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      padding: 32px 28px 28px;
      min-height: 240px;
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s ease;
    }
    .card:hover, .card:focus-visible {
      transform: scale(1.02);
      box-shadow: var(--shadow-hover);
      outline: none;
    }

    .app-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.75rem;
      margin-bottom: 22px;
      background: var(--accent);
      background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent));
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--secondary);
      font-size: 1rem;
      line-height: 1.45;
      flex: 1;
    }

    .play {
      margin-top: 22px;
      color: var(--blue);
      font-size: 1rem;
      font-weight: 500;
    }
    .play::after { content: " ›"; }
    .card:hover .play { text-decoration: underline; }

    /* Riquadro "prossimamente" */
    .card.soon {
      background: transparent;
      box-shadow: none;
      border: 1.5px dashed var(--line);
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: default;
    }
    .card.soon:hover { transform: none; }
    .card.soon .plus {
      font-size: 2rem;
      font-weight: 200;
      color: var(--secondary);
      margin-bottom: 8px;
    }
    .card.soon h2 { font-size: 1.05rem; font-weight: 500; color: var(--secondary); margin: 0; }

    footer {
      margin-top: 80px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--secondary);
      font-size: .8rem;
    }

    /* Finestra condivisione */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: grid;
      place-items: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
      z-index: 10;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: relative;
      width: 100%;
      max-width: 340px;
      padding: 32px 24px 24px;
      border-radius: 22px;
      background: var(--sheet);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
      text-align: center;
      transform: scale(.96);
      transition: transform .3s cubic-bezier(.2, .8, .2, 1);
    }
    .overlay.open .sheet { transform: scale(1); }

    .sheet h3 { font-size: 1.25rem; font-weight: 600; margin-bottom: 4px; }
    .sheet .hint { color: var(--secondary); font-size: .9rem; margin-bottom: 22px; }

    .close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: var(--field);
      color: var(--secondary);
      font-size: .95rem;
      cursor: pointer;
    }

    #qrcode {
      display: inline-block;
      padding: 12px;
      background: #fff;
      border-radius: 14px;
      margin-bottom: 22px;
    }
    #qrcode img, #qrcode canvas { display: block; width: 180px; height: 180px; }

    .link-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 6px 6px 14px;
      border-radius: 12px;
      background: var(--field);
    }
    .link-row input {
      flex: 1;
      min-width: 0;
      border: none;
      background: none;
      color: var(--text);
      font: inherit;
      font-size: .85rem;
      outline: none;
    }
    .copy-btn {
      flex-shrink: 0;
      padding: 8px 14px;
      border: none;
      border-radius: 9px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: .85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s ease;
    }
    .copy-btn.done { background: #34c759; }

    .native-share {
      display: none;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--field);
      color: var(--blue);
      font: inherit;
      font-size: .95rem;
      font-weight: 500;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">Yeezik</p>
      <h1>Games.</h1>
      <p class="subtitle">Scegli un gioco. Inizia la partita.</p>
      <button class="share-btn" id="openShare" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        Condividi
      </button>
    </header>

    <main class="grid" id="grid"></main>

    <footer>© <span id="year"></span> Yeezik</footer>
  </div>

  <!-- Finestra di condivisione -->
  <div class="overlay" id="shareOverlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
      <button class="close" id="closeShare" type="button" aria-label="Chiudi">✕</button>
      <h3 id="shareTitle">Invita gli amici</h3>
      <p class="hint">Inquadra il codice o copia il link.</p>
      <div id="qrcode"></div>
      <div class="link-row">
        <input id="shareLink" type="text" readonly>
        <button class="copy-btn" id="copyBtn" type="button">Copia</button>
      </div>
      <button class="native-share" id="nativeShare" type="button">Condividi con un'app…</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    /* =====================================================
       ELENCO GIOCHI
       Per aggiungere un nuovo gioco copia un blocco { ... }
       e incollalo in fondo alla lista, poi cambia i campi:
         nome        → titolo del riquadro
         descrizione → testo breve sotto il titolo
         icona       → un'emoji
         link        → indirizzo del gioco
         colore      → colore dell'icona (formato #RRGGBB)
       ===================================================== */
    const GIOCHI = [
      {
        nome: "Intesa Vincente",
        descrizione: "Indovina la parola dalle definizioni dei compagni di squadra, contro il tempo.",
        icona: "🧠",
        link: "https://yeezikdev.github.io/intesa-vincente",
        colore: "#ff375f"
      },
      {
        nome: "Quiplash",
        descrizione: "Riempi i buchi con la risposta più divertente. Gli altri votano la migliore.",
        icona: "💬",
        link: "https://yeezikdev.github.io/quiplash",
        colore: "#0a84ff"
      },
      // Esempio per un nuovo gioco:
      // {
      //   nome: "Nuovo Gioco",
      //   descrizione: "Descrizione breve del gioco.",
      //   icona: "🎲",
      //   link: "https://yeezikdev.github.io/nuovo-gioco",
      //   colore: "#30d158"
      // },
    ];

    // Mostra il riquadro "Nuovi giochi in arrivo" in fondo (true / false)
    const MOSTRA_PROSSIMAMENTE = true;

    // Link che viene condiviso (cambialo qui se sposti la pagina)
    const LINK_CONDIVISIONE = "https://yeezikdev.github.io/yeezik-gameshub";

    /* ---------- Da qui in giù non serve modificare ---------- */
    const grid = document.getElementById("grid");

    GIOCHI.forEach(g => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = g.link;
      a.style.setProperty("--accent", g.colore || "#0a84ff");
      a.innerHTML = `
        <div class="app-icon"></div>
        <h2></h2>
        <p></p>
        <span class="play">Gioca</span>
      `;
      a.querySelector(".app-icon").textContent = g.icona || "🎮";
      a.querySelector("h2").textContent = g.nome;
      a.querySelector("p").textContent = g.descrizione || "";
      grid.appendChild(a);
    });

    if (MOSTRA_PROSSIMAMENTE) {
      const soon = document.createElement("div");
      soon.className = "card soon";
      soon.innerHTML = `<div class="plus">+</div><h2>Nuovi giochi in arrivo</h2>`;
      grid.appendChild(soon);
    }

    document.getElementById("year").textContent = new Date().getFullYear();

    /* ---------- Condivisione ---------- */
    const overlay = document.getElementById("shareOverlay");
    const linkInput = document.getElementById("shareLink");
    const copyBtn = document.getElementById("copyBtn");
    const nativeBtn = document.getElementById("nativeShare");
    let qrCreato = false;

    linkInput.value = LINK_CONDIVISIONE;

    function apriCondividi() {
      if (!qrCreato && window.QRCode) {
        new QRCode(document.getElementById("qrcode"), {
          text: LINK_CONDIVISIONE,
          width: 360,
          height: 360,
          colorDark: "#1d1d1f",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
        qrCreato = true;
      }
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
    }

    function chiudiCondividi() {
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
    }

    document.getElementById("openShare").addEventListener("click", apriCondividi);
    document.getElementById("closeShare").addEventListener("click", chiudiCondividi);
    overlay.addEventListener("click", e => { if (e.target === overlay) chiudiCondividi(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") chiudiCondividi(); });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(LINK_CONDIVISIONE);
      } catch {
        linkInput.select();
        document.execCommand("copy");
      }
      copyBtn.textContent = "Copiato";
      copyBtn.classList.add("done");
      setTimeout(() => {
        copyBtn.textContent = "Copia";
        copyBtn.classList.remove("done");
      }, 2000);
    });

    // Su telefono compare anche il pulsante per condividere su WhatsApp, Telegram, ecc.
    if (navigator.share) {
      nativeBtn.style.display = "block";
      nativeBtn.addEventListener("click", () => {
        navigator.share({
          title: "Yeezik Games",
          text: "Vieni a giocare con me!",
          url: LINK_CONDIVISIONE
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
